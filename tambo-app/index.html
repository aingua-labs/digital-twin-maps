<!doctype html>
<html lang="en" data-day="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Twin maps: ask the maps</title>
    <script>
      (function(){var h=new Date().getHours(),d=h>=5&&h<11?"morning":h>=11&&h<17?"day":h>=17&&h<21?"evening":"night";
        document.documentElement.setAttribute("data-day",d);})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
